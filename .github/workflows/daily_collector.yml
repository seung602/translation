name: Translate DB

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "테스트할 때만 숫자 입력 (예: 50), 전체 번역은 비워두기"
        required: false
        default: ""
      batch_size:
        description: "한 번에 번역할 상품명 수 (무료 한도 고려 시 50 추천)"
        required: false
        default: "50"
      model:
        description: "Gemini model (예: gemini-1.5-flash-latest 또는 gemini-2.0-flash-exp)"
        required: false
        default: "gemini-1.5-flash-latest"

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ github.event.inputs.model }}
      TRANSLATE_ENABLED: "1"
      TRANSLATE_BATCH_SIZE: ${{ github.event.inputs.batch_size }}
      TRANSLATE_MAX_PER_RUN: "1000000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fail if GEMINI_API_KEY is missing
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "❌ GitHub Secrets에 GEMINI_API_KEY가 없습니다."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run translation
        run: |
          if [ -z "${{ github.event.inputs.max_items }}" ]; then
            echo "전체 번역을 시작합니다."
            python translate_service.py --force-all
          else
            echo "테스트 번역을 시작합니다: ${{ github.event.inputs.max_items }}개"
            python translate_service.py --force-all --max-items "${{ github.event.inputs.max_items }}"
          fi

      - name: Upload translated DB
        uses: actions/upload-artifact@v4
        with:
          name: translated-beauty-catalog
          path: beauty_catalog.db
          if-no-files-found: error
          retention-days: 14
